<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
<title id="title">A URL names the protocol, machine, process, and resource</title>
<desc id="description">The URL http://localhost:8000/api/todos has four parts used in this tutorial. The scheme http selects the protocol without TLS. The host localhost names the machine, here the same computer. The port 8000 selects the listening process, Flask. The path /api/todos is matched by Flask&#x27;s router to a handler and need not correspond to a file.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="440" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">A URL names the protocol, machine, process, and resource</text>
<text id="text-2" x="40" y="83" class="muted">Each card is one piece of http://localhost:8000/api/todos, read left to right.</text>
<rect x="40.0" y="140" width="253.0" height="170" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-3" x="62.0" y="174" class="heading" font-size="22px" style="font-size:22px">http://</text>
<text id="text-4" x="62.0" y="208" class="body">Scheme: which</text>
<text id="text-5" x="62.0" y="233" class="body">protocol. https adds</text>
<text id="text-6" x="62.0" y="258" class="body">TLS encryption.</text>
<rect x="329.0" y="140" width="253.0" height="170" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-7" x="351.0" y="174" class="heading" font-size="22px" style="font-size:22px">localhost</text>
<text id="text-8" x="351.0" y="208" class="body">Host: which machine.</text>
<text id="text-9" x="351.0" y="233" class="body">DNS turns names into</text>
<text id="text-10" x="351.0" y="258" class="body">IP addresses.</text>
<rect x="618.0" y="140" width="253.0" height="170" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-11" x="640.0" y="174" class="heading" font-size="22px" style="font-size:22px">:8000</text>
<text id="text-12" x="640.0" y="208" class="body">Port: which listening</text>
<text id="text-13" x="640.0" y="233" class="body">process on that</text>
<text id="text-14" x="640.0" y="258" class="body">machine. Here Flask.</text>
<rect x="907.0" y="140" width="253.0" height="170" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-15" x="929.0" y="174" class="heading" font-size="22px" style="font-size:22px">/api/todos</text>
<text id="text-16" x="929.0" y="208" class="body">Path: which resource.</text>
<text id="text-17" x="929.0" y="233" class="body">Flask routes it to a</text>
<text id="text-18" x="929.0" y="258" class="body">handler.</text>
<path d="M293.0 225.0 L329.0 225.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M582.0 225.0 L618.0 225.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M871.0 225.0 L907.0 225.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="350" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-19" x="60" y="380" class="body">A connection-refused error stops at host and port; a 404 means the process answered but has no such path.</text>
</svg>
