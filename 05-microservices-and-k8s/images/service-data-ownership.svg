<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="486" viewBox="0 0 1200 486" role="img" aria-labelledby="title description">
<title id="title">Private data changes through its owning service</title>
<desc id="description">Private storage boundaries reduce the chance that one team&#x27;s schema change silently breaks another service. Sharing a database server can still preserve logical ownership with appropriate databases, schemas, and permissions. Conversely, three separate servers do not create independence if each service directly edits the others&#x27; tables. The useful boundary is the supported data-access contract.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="486" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Private data changes through its owning service</text>
<text id="text-2" x="40" y="83" class="muted">The arrows inside the cards mean authorized data access by the owning service.</text>
<rect x="40.0" y="150" width="352.0" height="200" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-4" x="62.0" y="184" class="heading" font-size="22px" style="font-size:22px">User service → user</text>
<text id="text-5" x="62.0" y="210" class="heading" font-size="22px" style="font-size:22px">data</text>
<text id="text-6" x="62.0" y="244" class="body">Profile changes use the User</text>
<text id="text-7" x="62.0" y="269" class="body">API.</text>
<text id="text-8" x="62.0" y="294" class="body">Other services do not edit its</text>
<text id="text-9" x="62.0" y="319" class="body">private schema.</text>
<rect x="424.0" y="150" width="352.0" height="200" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-11" x="446.0" y="184" class="heading" font-size="22px" style="font-size:22px">Product service →</text>
<text id="text-12" x="446.0" y="210" class="heading" font-size="22px" style="font-size:22px">product data</text>
<text id="text-13" x="446.0" y="244" class="body">Catalog changes use the</text>
<text id="text-14" x="446.0" y="269" class="body">Product API.</text>
<text id="text-15" x="446.0" y="294" class="body">Published events can share</text>
<text id="text-16" x="446.0" y="319" class="body">selected changes.</text>
<rect x="808.0" y="150" width="352.0" height="200" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-18" x="830.0" y="184" class="heading" font-size="22px" style="font-size:22px">Order service → order</text>
<text id="text-19" x="830.0" y="210" class="heading" font-size="22px" style="font-size:22px">data</text>
<text id="text-20" x="830.0" y="244" class="body">Order transitions use the</text>
<text id="text-21" x="830.0" y="269" class="body">Order API.</text>
<text id="text-22" x="830.0" y="294" class="body">Cross-service rules require</text>
<text id="text-23" x="830.0" y="319" class="body">explicit coordination.</text>
<rect x="40" y="396" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-25" x="60" y="426" class="body">Choose ownership and consistency rules before choosing how many database servers to operate.</text>
</svg>
