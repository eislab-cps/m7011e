<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="651" viewBox="0 0 1200 651" role="img" aria-labelledby="title description">
<title id="title">Stable Pod identity connects each ordinal to its storage</title>
<desc id="description">A stateful application may need to reconnect a replacement process to the same identity and files. A StatefulSet and volume claim templates provide that mapping. The diagram does not configure database replication, leader election, backups, or high availability. Starting three PostgreSQL processes without a replication design does not turn them into a coordinated primary-replica database.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="651" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Stable Pod identity connects each ordinal to its storage</text>
<text id="text-2" x="40" y="83" class="muted">Each branch is an ordinal identity and its own persistent-volume claim, not a copied database.</text>
<rect x="40" y="150" width="1120" height="110" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-4" x="62" y="184" class="heading" font-size="22px" style="font-size:22px">StatefulSet with per-Pod volume claims</text>
<text id="text-5" x="62" y="218" class="body">Default ordered creation and stable ordinal names support identity-sensitive applications.</text>
<path d="M600 260 V310 H213.33333333333334 V360" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="360" width="346.6666666666667" height="149" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-8" x="62.0" y="394" class="heading" font-size="22px" style="font-size:22px">app-0</text>
<text id="text-9" x="62.0" y="428" class="body">Stable ordinal: 0.</text>
<text id="text-10" x="62.0" y="453" class="body">Reuses its corresponding</text>
<text id="text-11" x="62.0" y="478" class="body">storage claim.</text>
<path d="M600 260 V310 H600.0 V360" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="426.6666666666667" y="360" width="346.6666666666667" height="149" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-14" x="448.6666666666667" y="394" class="heading" font-size="22px" style="font-size:22px">app-1</text>
<text id="text-15" x="448.6666666666667" y="428" class="body">Stable ordinal: 1.</text>
<text id="text-16" x="448.6666666666667" y="453" class="body">Reuses its corresponding</text>
<text id="text-17" x="448.6666666666667" y="478" class="body">storage claim.</text>
<path d="M600 260 V310 H986.6666666666667 V360" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="813.3333333333334" y="360" width="346.6666666666667" height="149" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-20" x="835.3333333333334" y="394" class="heading" font-size="22px" style="font-size:22px">app-2</text>
<text id="text-21" x="835.3333333333334" y="428" class="body">Stable ordinal: 2.</text>
<text id="text-22" x="835.3333333333334" y="453" class="body">Reuses its corresponding</text>
<text id="text-23" x="835.3333333333334" y="478" class="body">storage claim.</text>
<rect x="40" y="561" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-25" x="60" y="591" class="body">OrderedReady is the default policy; stable identity does not mean a permanent Pod IP.</text>
</svg>
