<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="625" viewBox="0 0 1200 625" role="img" aria-labelledby="title description">
<title id="title">ConfigMaps and Secrets reach a Pod as environment or files</title>
<desc id="description">A ConfigMap holds non-sensitive settings such as LOG_LEVEL and a Secret holds values such as a database password. The Pod spec references both, either as environment variables through env or envFrom, or as files through a mounted volume. The same image can therefore run in different environments with different configuration. Secret values are base64-encoded in the API, not encrypted by that encoding; access to them must be restricted with RBAC and encryption at rest.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="625" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">ConfigMaps and Secrets reach a Pod as environment or files</text>
<text id="text-2" x="40" y="83" class="muted">Arrows show how configuration is injected when the Pod starts; the image stays unchanged.</text>
<rect x="40" y="140" width="330" height="150" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-3" x="62" y="174" class="heading" font-size="22px" style="font-size:22px">ConfigMap app-config</text>
<text id="text-4" x="62" y="208" class="body">LOG_LEVEL: info</text>
<text id="text-5" x="62" y="233" class="body">DATABASE_URL:</text>
<text id="text-6" x="62" y="258" class="body">postgres-service:5432</text>
<rect x="40" y="320" width="330" height="150" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-7" x="62" y="354" class="heading" font-size="22px" style="font-size:22px">Secret db-secret</text>
<text id="text-8" x="62" y="388" class="body">password: (base64)</text>
<rect x="530" y="140" width="630" height="330" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-9" x="552" y="174" class="heading" font-size="22px" style="font-size:22px">Pod: user-service</text>
<text id="text-10" x="552" y="208" class="body">Container from an unchanged image.</text>
<text id="text-11" x="552" y="233" class="body">As environment variables through env or envFrom.</text>
<text id="text-12" x="552" y="258" class="body">As files: a volume mounted at /etc/config.</text>
<text id="text-13" x="552" y="283" class="body">The same image can run in development and production with</text>
<text id="text-14" x="552" y="308" class="body">different values.</text>
<path d="M370.0 215.0 L530.0 215.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M370.0 395.0 L530.0 395.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="510" width="1120" height="85" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-15" x="60" y="540" class="body">Environment variables are read at container start, so changing a ConfigMap usually needs a restart to take</text>
<text id="text-16" x="60" y="565" class="body">effect; mounted files update later.</text>
</svg>
