<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="651" viewBox="0 0 1200 651" role="img" aria-labelledby="title description">
<title id="title">Independent services require owned data and compatible APIs</title>
<desc id="description">Separate deployment is useful when a responsibility needs to change or scale independently. Data ownership prevents another service from becoming dependent on private table layouts. It does not require a separate physical database machine for each service. Once one operation crosses these boundaries, retries, compatibility, and cross-service consistency become design work rather than local function-call details.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="651" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Independent services require owned data and compatible APIs</text>
<text id="text-2" x="40" y="83" class="muted">Each branch is a service responsibility together with the data it owns.</text>
<rect x="40" y="150" width="1120" height="110" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-4" x="62" y="184" class="heading" font-size="22px" style="font-size:22px">Client → API gateway</text>
<text id="text-5" x="62" y="218" class="body">Routes the request to a business capability with a supported contract.</text>
<path d="M600 260 V310 H213.33333333333334 V360" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="360" width="346.6666666666667" height="149" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-8" x="62.0" y="394" class="heading" font-size="22px" style="font-size:22px">User service</text>
<text id="text-9" x="62.0" y="428" class="body">Owns user-profile data.</text>
<text id="text-10" x="62.0" y="453" class="body">Other services use its API or</text>
<text id="text-11" x="62.0" y="478" class="body">events.</text>
<path d="M600 260 V310 H600.0 V360" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="426.6666666666667" y="360" width="346.6666666666667" height="149" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-14" x="448.6666666666667" y="394" class="heading" font-size="22px" style="font-size:22px">Product service</text>
<text id="text-15" x="448.6666666666667" y="428" class="body">Owns product data.</text>
<text id="text-16" x="448.6666666666667" y="453" class="body">Changes private schema behind</text>
<text id="text-17" x="448.6666666666667" y="478" class="body">its contract.</text>
<path d="M600 260 V310 H986.6666666666667 V360" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="813.3333333333334" y="360" width="346.6666666666667" height="149" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-20" x="835.3333333333334" y="394" class="heading" font-size="22px" style="font-size:22px">Order service</text>
<text id="text-21" x="835.3333333333334" y="428" class="body">Owns order state.</text>
<text id="text-22" x="835.3333333333334" y="453" class="body">Coordinates operations across</text>
<text id="text-23" x="835.3333333333334" y="478" class="body">boundaries explicitly.</text>
<rect x="40" y="561" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-25" x="60" y="591" class="body">A database-per-service boundary is about ownership, not necessarily separate hardware.</text>
</svg>
