<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="676" viewBox="0 0 1200 676" role="img" aria-labelledby="title description">
<title id="title">A Service provides stable discovery for replaceable Pods</title>
<desc id="description">A Service solves discovery when replica names and IP addresses change. It is a Kubernetes API abstraction implemented by the cluster&#x27;s networking, not a new copy of the application or necessarily a proxy process handling each JSON request. Endpoint selection follows labels and readiness. Load distribution is not a promise that every HTTP request gets a different replica; connection reuse and protocol behavior matter.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="676" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">A Service provides stable discovery for replaceable Pods</text>
<text id="text-2" x="40" y="83" class="muted">Branches represent eligible endpoints behind one stable Service abstraction.</text>
<rect x="40" y="150" width="1120" height="110" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-4" x="62" y="184" class="heading" font-size="22px" style="font-size:22px">Client → user-service:5000</text>
<text id="text-5" x="62" y="218" class="body">A Service name and port remain stable while matching ready endpoints can change.</text>
<path d="M600 260 V310 H213.33333333333334 V360" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="360" width="346.6666666666667" height="174" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-8" x="62.0" y="394" class="heading" font-size="22px" style="font-size:22px">Ready Pod A</text>
<text id="text-9" x="62.0" y="428" class="body">Selected by matching labels.</text>
<text id="text-10" x="62.0" y="453" class="body">Runs one instance of the</text>
<text id="text-11" x="62.0" y="478" class="body">application.</text>
<path d="M600 260 V310 H600.0 V360" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="426.6666666666667" y="360" width="346.6666666666667" height="174" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-14" x="448.6666666666667" y="394" class="heading" font-size="22px" style="font-size:22px">Ready Pod B</text>
<text id="text-15" x="448.6666666666667" y="428" class="body">Selected by matching labels.</text>
<text id="text-16" x="448.6666666666667" y="453" class="body">Can receive a different</text>
<text id="text-17" x="448.6666666666667" y="478" class="body">connection.</text>
<path d="M600 260 V310 H986.6666666666667 V360" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="813.3333333333334" y="360" width="346.6666666666667" height="174" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-20" x="835.3333333333334" y="394" class="heading" font-size="22px" style="font-size:22px">Replacement Pod C</text>
<text id="text-21" x="835.3333333333334" y="428" class="body">Becomes an endpoint when</text>
<text id="text-22" x="835.3333333333334" y="453" class="body">eligible and ready.</text>
<text id="text-23" x="835.3333333333334" y="478" class="body">Does not require the client to</text>
<text id="text-24" x="835.3333333333334" y="503" class="body">learn a new Pod name.</text>
<rect x="40" y="586" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-26" x="60" y="616" class="body">Labels select the backend set; readiness and networking determine usable destinations.</text>
</svg>
