<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="718" viewBox="0 0 1200 718" role="img" aria-labelledby="title description">
<title id="title">Choose a controller from identity and lifecycle requirements</title>
<desc id="description">The important distinction is the workload&#x27;s identity and lifecycle, not simply whether the program ever writes data. A Deployment can mount persistent storage, and a StatefulSet does not automatically coordinate replicated databases. Increasing replicas before checking shared-state and duplicate-processing behavior can make an application less correct. Define the required storage access mode and the application&#x27;s concurrency model before scaling it.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="718" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Choose a controller from identity and lifecycle requirements</text>
<text id="text-2" x="40" y="83" class="muted">These are independent design questions; no single yes/no storage question selects every controller.</text>
<rect x="40.0" y="150" width="352.0" height="200" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-4" x="62.0" y="184" class="heading" font-size="22px" style="font-size:22px">Interchangeable API</text>
<text id="text-5" x="62.0" y="210" class="heading" font-size="22px" style="font-size:22px">replicas</text>
<text id="text-6" x="62.0" y="244" class="body">Need repeatable processes and</text>
<text id="text-7" x="62.0" y="269" class="body">rolling replacement?</text>
<text id="text-8" x="62.0" y="294" class="body">A Deployment is a common</text>
<text id="text-9" x="62.0" y="319" class="body">starting point.</text>
<rect x="424.0" y="150" width="352.0" height="200" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-11" x="446.0" y="184" class="heading" font-size="22px" style="font-size:22px">Stable per-instance</text>
<text id="text-12" x="446.0" y="210" class="heading" font-size="22px" style="font-size:22px">identity</text>
<text id="text-13" x="446.0" y="244" class="body">Need an ordinal name and its</text>
<text id="text-14" x="446.0" y="269" class="body">associated storage?</text>
<text id="text-15" x="446.0" y="294" class="body">Evaluate a StatefulSet and</text>
<text id="text-16" x="446.0" y="319" class="body">volume claims.</text>
<rect x="808.0" y="150" width="352.0" height="200" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-18" x="830.0" y="184" class="heading" font-size="22px" style="font-size:22px">Persistent data</text>
<text id="text-19" x="830.0" y="218" class="body">Need files to outlive a</text>
<text id="text-20" x="830.0" y="243" class="body">process?</text>
<text id="text-21" x="830.0" y="268" class="body">Choose appropriate storage; a</text>
<text id="text-22" x="830.0" y="293" class="body">Deployment can mount a PVC</text>
<text id="text-23" x="830.0" y="318" class="body">too.</text>
<rect x="40.0" y="382" width="352.0" height="200" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-25" x="62.0" y="416" class="heading" font-size="22px" style="font-size:22px">More capacity</text>
<text id="text-26" x="62.0" y="450" class="body">Can several instances safely</text>
<text id="text-27" x="62.0" y="475" class="body">perform the same work?</text>
<text id="text-28" x="62.0" y="500" class="body">Only then consider replicas</text>
<text id="text-29" x="62.0" y="525" class="body">and autoscaling.</text>
<rect x="424.0" y="382" width="352.0" height="200" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-31" x="446.0" y="416" class="heading" font-size="22px" style="font-size:22px">Replicated database</text>
<text id="text-32" x="446.0" y="450" class="body">Need coordinated copies and</text>
<text id="text-33" x="446.0" y="475" class="body">failover?</text>
<text id="text-34" x="446.0" y="500" class="body">Configure the database&#x27;s</text>
<text id="text-35" x="446.0" y="525" class="body">replication and recovery</text>
<text id="text-36" x="446.0" y="550" class="body">design.</text>
<rect x="808.0" y="382" width="352.0" height="200" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-38" x="830.0" y="416" class="heading" font-size="22px" style="font-size:22px">Single finite task</text>
<text id="text-39" x="830.0" y="450" class="body">Need completion rather than a</text>
<text id="text-40" x="830.0" y="475" class="body">permanent server?</text>
<text id="text-41" x="830.0" y="500" class="body">Consider a Job with deliberate</text>
<text id="text-42" x="830.0" y="525" class="body">retry and data rules.</text>
<rect x="40" y="628" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-44" x="60" y="658" class="body">Persistence, per-Pod identity, replication, and scaling are different requirements.</text>
</svg>
