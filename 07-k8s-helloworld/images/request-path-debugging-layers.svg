<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="755" viewBox="0 0 1200 755" role="img" aria-labelledby="title description">
<title id="title">Check the request path one layer at a time</title>
<desc id="description">A public HTTPS request depends on DNS resolving the host, TLS presenting a certificate for that host, the Ingress rule matching host and path, the Service having ready endpoints, and the Pod being ready and serving the HTML. Each layer has its own command and symptom, so a failure tells you how far the request got.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="755" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Check the request path one layer at a time</text>
<text id="text-2" x="40" y="83" class="muted">Read top to bottom: each layer must work before the next one can be tested.</text>
<rect x="40" y="120" width="200" height="80" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-3" x="62" y="154" class="heading" font-size="22px" style="font-size:22px">DNS</text>
<rect x="260" y="120" width="470" height="80" rx="14" fill="#f4f6f8" stroke="#c3ccd5" stroke-width="2"/>
<text id="text-4" x="282" y="154" class="code">nslookup &lt;your-domain&gt;</text>
<rect x="750" y="120" width="410" height="80" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-5" x="772" y="154" class="body">Name does not resolve: browser cannot</text>
<text id="text-6" x="772" y="179" class="body">find the site.</text>
<rect x="40" y="220" width="200" height="80" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-7" x="62" y="254" class="heading" font-size="22px" style="font-size:22px">TLS</text>
<rect x="260" y="220" width="470" height="80" rx="14" fill="#f4f6f8" stroke="#c3ccd5" stroke-width="2"/>
<text id="text-8" x="282" y="254" class="code">kubectl get certificate -n helloworld</text>
<rect x="750" y="220" width="410" height="80" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-9" x="772" y="254" class="body">READY False, or browser warns about</text>
<text id="text-10" x="772" y="279" class="body">name or issuer.</text>
<path d="M140.0 200.0 L140.0 220.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="320" width="200" height="80" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-11" x="62" y="354" class="heading" font-size="22px" style="font-size:22px">Ingress</text>
<rect x="260" y="320" width="470" height="80" rx="14" fill="#f4f6f8" stroke="#c3ccd5" stroke-width="2"/>
<text id="text-12" x="282" y="354" class="code">kubectl describe ingress -n helloworld</text>
<rect x="750" y="320" width="410" height="80" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-13" x="772" y="354" class="body">404 from Traefik: host or path does</text>
<text id="text-14" x="772" y="379" class="body">not match.</text>
<path d="M140.0 300.0 L140.0 320.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="420" width="200" height="80" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-15" x="62" y="454" class="heading" font-size="22px" style="font-size:22px">Service</text>
<rect x="260" y="420" width="470" height="80" rx="14" fill="#f4f6f8" stroke="#c3ccd5" stroke-width="2"/>
<text id="text-16" x="282" y="454" class="code">kubectl get endpoints -n helloworld</text>
<rect x="750" y="420" width="410" height="80" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-17" x="772" y="454" class="body">No endpoints: selector matches no</text>
<text id="text-18" x="772" y="479" class="body">ready Pod (502/503).</text>
<path d="M140.0 400.0 L140.0 420.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="520" width="200" height="80" rx="14" fill="#f4f6f8" stroke="#c3ccd5" stroke-width="2"/>
<text id="text-19" x="62" y="554" class="heading" font-size="22px" style="font-size:22px">Pod</text>
<rect x="260" y="520" width="470" height="80" rx="14" fill="#f4f6f8" stroke="#c3ccd5" stroke-width="2"/>
<text id="text-20" x="282" y="554" class="code">kubectl get pods -n helloworld</text>
<rect x="750" y="520" width="410" height="80" rx="14" fill="#f4f6f8" stroke="#c3ccd5" stroke-width="2"/>
<text id="text-21" x="772" y="554" class="body">Not 1/1 ready, crash loop, or wrong</text>
<text id="text-22" x="772" y="579" class="body">ConfigMap content.</text>
<path d="M140.0 500.0 L140.0 520.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="640" width="1120" height="85" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-23" x="60" y="670" class="body">A Pod can be ready while the public URL fails: work down the layers until one check disagrees with your</text>
<text id="text-24" x="60" y="695" class="body">prediction.</text>
</svg>
