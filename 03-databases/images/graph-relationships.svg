<text text-anchor="middle" x="566.54" y="-364.63" font-family="DejaVu Sans" font-size="27.00" id="text-0">Graph edges represent relationships in the data</text>
<text text-anchor="middle" x="566.54" y="-334.63" font-family="DejaVu Sans" font-size="27.00" id="text-1">FOLLOWS, POSTED, LIKED, and WORKS_AT are stored facts</text>

