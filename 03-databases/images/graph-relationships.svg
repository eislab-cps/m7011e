<title id="title">Graph edges represent relationships in the data</title><desc id="description">Here an arrow such as FOLLOWS is a stored relationship, not a network message between two services. Traversing Alice → Bob → a post answers a different question from looking up Alice's row by ID. Graph databases make such connected-data operations central to the model. Relational joins can also represent relationships, so the choice depends on the traversal workload and operational constraints.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(28.8 419.03)">
