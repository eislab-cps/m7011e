<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="651" viewBox="0 0 1200 651" role="img" aria-labelledby="title description">
<title id="title">Redis serves memory-resident data with configurable persistence</title>
<desc id="description">A cache exists to avoid repeatedly doing more expensive work, such as a remote lookup or calculation. Redis can also be used for other data roles, but persistence and recovery must be deliberately configured; keeping a value in RAM is not the same as making it durable. A cache introduces another correctness problem: knowing when a stored result has become stale.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="651" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Redis serves memory-resident data with configurable persistence</text>
<text id="text-2" x="40" y="83" class="muted">The branches distinguish the live serving state from optional persistence mechanisms.</text>
<rect x="40" y="150" width="1120" height="110" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-4" x="62" y="184" class="heading" font-size="22px" style="font-size:22px">Redis command processing</text>
<text id="text-5" x="62" y="218" class="body">Applications issue commands against keys and data structures.</text>
<path d="M600 260 V310 H310.0 V360" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="360" width="540.0" height="149" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-8" x="62.0" y="394" class="heading" font-size="22px" style="font-size:22px">Memory-resident state</text>
<text id="text-9" x="62.0" y="428" class="body">Used to serve operations.</text>
<text id="text-10" x="62.0" y="453" class="body">Capacity and eviction policy affect retained</text>
<text id="text-11" x="62.0" y="478" class="body">keys.</text>
<path d="M600 260 V310 H890.0 V360" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="620.0" y="360" width="540.0" height="149" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-14" x="642.0" y="394" class="heading" font-size="22px" style="font-size:22px">Persistence files</text>
<text id="text-15" x="642.0" y="428" class="body">RDB snapshots and/or AOF when configured.</text>
<text id="text-16" x="642.0" y="453" class="body">Recovery behavior depends on the chosen settings.</text>
<rect x="40" y="561" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-18" x="60" y="591" class="body">Decide whether losing or evicting a key is acceptable for this particular use.</text>
</svg>
