<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title description">
<title id="title">Two writers sharing a file can lose an update</title>
<desc id="description">Two requests read the same file contents. One writes a new todo, then the other overwrites it using the older state. Preventing this needs coordinated updates. A database can provide conditional writes, locking, and suitable transaction isolation, but simply using a transaction does not automatically prevent every lost update.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="570" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Two writers sharing a file can lose an update</text>
<text id="text-2" x="40" y="83" class="muted">Time runs left to right; both requests start from the same file contents.</text>
<rect x="40" y="150" width="170" height="110" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-3" x="62" y="184" class="heading" font-size="22px" style="font-size:22px">Request A</text>
<rect x="40" y="330" width="170" height="110" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-4" x="62" y="364" class="heading" font-size="22px" style="font-size:22px">Request B</text>
<rect x="250.0" y="150" width="276.7" height="110" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-5" x="272.0" y="184" class="heading" font-size="22px" style="font-size:22px">Read</text>
<text id="text-6" x="272.0" y="218" class="body">3 todos</text>
<rect x="566.7" y="150" width="276.7" height="110" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-7" x="588.7" y="184" class="heading" font-size="22px" style="font-size:22px">Add todo 4</text>
<text id="text-8" x="588.7" y="218" class="body">in memory</text>
<rect x="883.3" y="150" width="276.7" height="110" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-9" x="905.3" y="184" class="heading" font-size="22px" style="font-size:22px">Write file</text>
<text id="text-10" x="905.3" y="218" class="body">4 todos saved</text>
<path d="M526.7 205.0 L566.7 205.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M843.4 205.0 L883.3 205.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="250.0" y="330" width="276.7" height="110" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-11" x="272.0" y="364" class="heading" font-size="22px" style="font-size:22px">Read</text>
<text id="text-12" x="272.0" y="398" class="body">3 todos</text>
<rect x="566.7" y="330" width="276.7" height="110" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-13" x="588.7" y="364" class="heading" font-size="22px" style="font-size:22px">Complete todo 2</text>
<text id="text-14" x="588.7" y="398" class="body">in memory</text>
<rect x="883.3" y="330" width="276.7" height="110" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-15" x="905.3" y="364" class="heading" font-size="22px" style="font-size:22px">Write file</text>
<text id="text-16" x="905.3" y="398" class="body">3 todos: todo 4 lost</text>
<path d="M526.7 385.0 L566.7 385.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M843.4 385.0 L883.3 385.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text id="text-17" x="900" y="295" class="muted" text-anchor="middle" font-size="16px" style="font-size:16px">B&#x27;s write replaces A&#x27;s</text>
<rect x="40" y="480" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-18" x="60" y="510" class="body">Use suitable isolation, locking, or conditional writes to detect or prevent conflicting updates.</text>
</svg>
