<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="499" viewBox="0 0 1200 499" role="img" aria-labelledby="title description">
<title id="title">Similarity search depends on an embedding model</title>
<desc id="description">Keyword equality cannot directly express that two different sentences have similar meaning. An embedding model makes a numerical representation that a vector index can search by distance. The index does not establish truth or usefulness: results depend on the model, the metric, filtering, and the dataset. Approximate search can trade recall for speed, which must be measured against the application&#x27;s needs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="499" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Similarity search depends on an embedding model</text>
<text id="text-2" x="40" y="83" class="muted">Arrows trace a search pipeline; similarity is a model-dependent score.</text>
<rect x="40.0" y="150" width="320.0" height="199" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-4" x="62.0" y="184" class="heading" font-size="22px" style="font-size:22px">Input and embedding</text>
<text id="text-5" x="62.0" y="218" class="body">A model maps text or media</text>
<text id="text-6" x="62.0" y="243" class="body">to vectors.</text>
<text id="text-7" x="62.0" y="268" class="body">Use compatible</text>
<text id="text-8" x="62.0" y="293" class="body">representations for queries</text>
<text id="text-9" x="62.0" y="318" class="body">and stored items.</text>
<rect x="440.0" y="150" width="320.0" height="199" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-11" x="462.0" y="184" class="heading" font-size="22px" style="font-size:22px">Vector index</text>
<text id="text-12" x="462.0" y="218" class="body">Stores vectors with item</text>
<text id="text-13" x="462.0" y="243" class="body">identifiers.</text>
<text id="text-14" x="462.0" y="268" class="body">Searches using a chosen</text>
<text id="text-15" x="462.0" y="293" class="body">distance measure.</text>
<path d="M360.0 249.5 L440.0 249.5" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="840.0" y="150" width="320.0" height="199" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-18" x="862.0" y="184" class="heading" font-size="22px" style="font-size:22px">Candidate results</text>
<text id="text-19" x="862.0" y="218" class="body">Returns nearby items for</text>
<text id="text-20" x="862.0" y="243" class="body">the application.</text>
<text id="text-21" x="862.0" y="268" class="body">Relevance and permissions</text>
<text id="text-22" x="862.0" y="293" class="body">still need evaluation.</text>
<path d="M760.0 249.5 L840.0 249.5" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="409" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-25" x="60" y="439" class="body">A nearby vector is a candidate result, not proof that its content is correct.</text>
</svg>
