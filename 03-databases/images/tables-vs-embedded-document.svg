<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title description">
<title id="title">Tables reference related data; documents can embed it</title>
<desc id="description">In PostgreSQL, users and posts are separate tables and each post row stores the user_id of its author, so a query joins them. In MongoDB the posts can be embedded as an array inside the user document, so one read returns the user with their posts. Embedding suits data read together and owned by one parent; references suit data that is shared, large, or queried independently.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="580" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Tables reference related data; documents can embed it</text>
<text id="text-2" x="40" y="83" class="muted">Left: two tables joined by a foreign key. Right: one document holding the same posts.</text>
<rect x="40" y="140" width="250" height="170" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-3" x="62" y="174" class="heading" font-size="22px" style="font-size:22px">users</text>
<text id="text-4" x="62" y="208" class="code">id | username</text>
<text id="text-5" x="62" y="233" class="code">1 | johndoe</text>
<rect x="330" y="140" width="300" height="170" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-6" x="352" y="174" class="heading" font-size="22px" style="font-size:22px">posts</text>
<text id="text-7" x="352" y="208" class="code">id | user_id | title</text>
<text id="text-8" x="352" y="233" class="code">7 | 1 | Hello</text>
<text id="text-9" x="352" y="258" class="code">8 | 1 | Docker</text>
<path d="M330.0 245.0 L290.0 245.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text id="text-10" x="310" y="233" class="muted" text-anchor="middle" font-size="16px" style="font-size:16px">FK</text>
<rect x="700" y="140" width="460" height="170" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-11" x="722" y="174" class="heading" font-size="22px" style="font-size:22px">users document</text>
<text id="text-12" x="722" y="208" class="code">{ _id: 1, username: &quot;johndoe&quot;,</text>
<text id="text-13" x="722" y="233" class="code">posts: [ {title: &quot;Hello&quot;},</text>
<text id="text-14" x="722" y="258" class="code">{title: &quot;Docker&quot;} ] }</text>
<rect x="40" y="340" width="590" height="110" rx="14" fill="#f4f6f8" stroke="#c3ccd5" stroke-width="2"/>
<text id="text-15" x="62" y="374" class="heading" font-size="22px" style="font-size:22px">Relational read</text>
<text id="text-16" x="62" y="408" class="body">SELECT ... FROM posts JOIN users ON posts.user_id =</text>
<text id="text-17" x="62" y="433" class="body">users.id</text>
<rect x="700" y="340" width="460" height="110" rx="14" fill="#f4f6f8" stroke="#c3ccd5" stroke-width="2"/>
<text id="text-18" x="722" y="374" class="heading" font-size="22px" style="font-size:22px">Document read</text>
<text id="text-19" x="722" y="408" class="body">db.users.findOne({ _id: 1 })</text>
<rect x="40" y="490" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-20" x="60" y="520" class="body">Embed what is read together and owned by one parent; reference what is shared or grows without bound.</text>
</svg>
