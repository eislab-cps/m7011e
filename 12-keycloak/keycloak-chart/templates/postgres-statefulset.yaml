apiVersion: apps/v1
kind: StatefulSet 
metadata:
  name: postgres-statefulset
  labels:
    app: postgres
spec:
  serviceName: "postgresql-internal"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
     metadata:
       labels:
          app: postgres
     spec:
         containers:
           - name: postgres
             image: {{ .Values.postgres.image }}
             # Some k3s/Ubuntu hosts' default AppArmor profile blocks the
             # signals Postgres uses during first-boot init, leaving it never
             # listening on TCP. Requires Kubernetes 1.30+.
             securityContext:
               appArmorProfile:
                 type: Unconfined
             imagePullPolicy: "IfNotPresent"
             ports:
               - containerPort: 5432
             readinessProbe:
               exec:
                 command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.keycloak.database.database | quote }}]
               initialDelaySeconds: 5
               periodSeconds: 5
             envFrom:
               - configMapRef:
                   name: postgres-config
               - secretRef:
                   name: postgres-credentials
             volumeMounts:
               - mountPath: /var/lib/postgresql/data
                 name: postgresdb
             {{ if .Values.postgres.resourceLimit }}
             resources:
                limits:
                  memory: {{ .Values.postgres.memory | quote }}
                requests:
                  cpu: {{ .Values.postgres.cpu | quote }}
                  memory: {{ .Values.postgres.memory | quote }}
             {{ end }}
         volumes:
           - name: postgresdb
             persistentVolumeClaim:
               claimName: postgresql-pvc
