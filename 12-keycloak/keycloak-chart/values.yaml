# PostgreSQL Database Configuration
postgres:
  storageClassName: "local-path"
  timezone: "Europe/Stockholm"
  user: "keycloak"
  password: "keycloak-secure-password-123"  # CHANGE THIS!
  image: "postgres:16"
  resourceLimit: false
  cpu: "1000m"
  memory: "1000Mi"
  storage: "5Gi"

# Keycloak Configuration
keycloak:
  replicas: 1
  # Unofficial rebuild of quay.io/keycloak/keycloak:23.0 that also runs on
  # older x86-64-v1 CPUs (the official image needs x86-64-v2).
  image: docker.io/cappelumpa/keycloak-x86-64-v1:23.0

  # Admin credentials (CHANGE THESE!)
  adminUser: admin
  adminPassword: admin-change-this-password

  # Database configuration
  database:
    vendor: postgres
    host: postgres-service  # Same namespace - simplified
    port: 5432
    database: keycloak
    username: keycloak
    password: keycloak-secure-password-123  # Must match PostgreSQL password

  # Resource limits (optional)
  # start-dev rebuilds Keycloak on every boot, which is CPU-heavy; 500m was
  # too little for older machines to finish starting.
  resources:
    limits:
      cpu: "2"
      memory: 1536Mi
    requests:
      cpu: 500m
      memory: 512Mi

# Ingress configuration
domain: keycloak.ltu-m7011e-johan.se  # Change to your domain
email: your.email@ltu.se              # Change to your email
certIssuer: letsencrypt-staging       # Use letsencrypt-prod for production
