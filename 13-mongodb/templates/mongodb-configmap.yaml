apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  labels:
    app: mongodb
data:
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.DBUser | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.DBPassword | quote }}
  MONGO_INITDB_DATABASE: {{ .Values.DBName | quote }}
  TZ: {{ .Values.Timezone | quote }}
