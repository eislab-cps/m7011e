apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app: mongodb
spec:
  storageClassName: {{ .Values.StorageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.DBStorage }}
