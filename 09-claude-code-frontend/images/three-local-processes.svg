<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="711" viewBox="0 0 1200 711" role="img" aria-labelledby="title description">
<title id="title">Three terminals run three separate programs</title>
<desc id="description">The Flask API from Tutorial 1 runs on port 8000 and stores todos. The Vite development server serves the React source from todo-react to the browser on the URL it prints. The assistant CLI edits files in todo-react; Vite reloads the page when they change. The browser loads the page from Vite and then sends API requests directly to Flask, which is why Flask&#x27;s CORS configuration matters.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="711" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Three terminals run three separate programs</text>
<text id="text-2" x="40" y="83" class="muted">Solid arrows are HTTP requests from the browser; the dashed arrow is file editing.</text>
<rect x="40" y="125" width="320" height="170" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-3" x="62" y="159" class="heading" font-size="22px" style="font-size:22px">Terminal 1: Flask</text>
<text id="text-4" x="62" y="189" class="heading" font-size="22px" style="font-size:22px">API</text>
<text id="text-5" x="62" y="223" class="body">python3 app.py</text>
<text id="text-6" x="62" y="248" class="body">Port 8000; stores todos in</text>
<text id="text-7" x="62" y="273" class="body">memory.</text>
<rect x="400" y="125" width="320" height="170" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-8" x="422" y="159" class="heading" font-size="22px" style="font-size:22px">Terminal 2: Vite</text>
<text id="text-9" x="422" y="193" class="body">npm run dev</text>
<text id="text-10" x="422" y="218" class="body">Serves todo-react on the URL</text>
<text id="text-11" x="422" y="243" class="body">it prints.</text>
<rect x="840" y="125" width="320" height="170" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-12" x="862" y="159" class="heading" font-size="22px" style="font-size:22px">Terminal 3: claude</text>
<text id="text-13" x="862" y="193" class="body">Assistant CLI; edits files in</text>
<text id="text-14" x="862" y="218" class="body">todo-react/.</text>
<rect x="300" y="420" width="600" height="136" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-15" x="322" y="454" class="heading" font-size="22px" style="font-size:22px">Browser</text>
<text id="text-16" x="322" y="488" class="body">Loads the page and JavaScript from Vite, then calls</text>
<text id="text-17" x="322" y="513" class="body">http://localhost:8000/api/todos.</text>
<path d="M420.0 420.0 L200.0 295.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text id="text-18" x="165" y="372" class="muted" text-anchor="middle" font-size="16px" style="font-size:16px">API calls: GET, POST, DELETE</text>
<path d="M560.0 420.0 L560.0 295.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text id="text-19" x="572.0" y="372" class="muted" text-anchor="start" font-size="16px" style="font-size:16px">page and JavaScript</text>
<path d="M840.0 220.0 L720.0 220.0" fill="none" stroke="#1559a6" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text id="text-20" x="780" y="205" class="muted" text-anchor="middle" font-size="16px" style="font-size:16px">edits</text>
<text id="text-21" x="780" y="248" class="muted" text-anchor="middle" font-size="16px" style="font-size:16px">files</text>
<rect x="40" y="596" width="1120" height="85" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-22" x="60" y="626" class="body">Stopping the assistant does not stop the app, and stopping Vite does not stop Flask: check each terminal</text>
<text id="text-23" x="60" y="651" class="body">separately.</text>
</svg>
