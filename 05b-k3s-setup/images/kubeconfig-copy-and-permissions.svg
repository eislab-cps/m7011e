<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title description">
<title id="title">Copy the kubeconfig and keep its credentials private</title>
<desc id="description">K3s writes a root-owned administrator kubeconfig at /etc/rancher/k3s/k3s.yaml. The Ubuntu user copies it with sudo into a private .kube directory, changes the copy owner to their own user and group, and applies mode 600. The directory uses mode 700. KUBECONFIG selects that private copy for kubectl and Helm.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="940" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Copy the kubeconfig and keep its credentials private</text>
<text id="text-2" x="40" y="83" class="muted">Both locations below are on the VM, inside the SSH session.</text>
<rect x="40" y="150" width="490" height="250" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-4" x="62" y="184" class="heading" font-size="22px" style="font-size:22px">K3s administrator file</text>
<text id="text-5" x="62" y="218" class="body">/etc/rancher/k3s/k3s.yaml</text>
<text id="text-6" x="62" y="243" class="body">Owner: root; normally mode 600.</text>
<text id="text-7" x="62" y="268" class="body">Contains cluster administrator credentials.</text>
<rect x="650" y="150" width="510" height="400" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-9" x="672" y="192" class="heading" font-size="22px" style="font-size:22px">Ubuntu user&#x27;s .kube directory</text>
<text id="text-10" x="672" y="228" class="body">Mode 700: owner-only directory access.</text>
<rect x="680" y="270" width="450" height="180" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-12" x="702" y="304" class="heading" font-size="22px" style="font-size:22px">Your client copy</text>
<text id="text-13" x="702" y="338" class="body">/home/ubuntu/.kube/config</text>
<text id="text-14" x="702" y="363" class="body">Owner: ubuntu; mode 600.</text>
<text id="text-15" x="702" y="388" class="body">Same cluster and credentials.</text>
<path d="M530 335 L680 335" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="561.7" y="284" width="86.60000000000001" height="30" fill="#fff"/>
<text id="text-18" x="605" y="305" class="body" text-anchor="middle">sudo cp</text>
<rect x="40" y="480" width="490" height="135" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-20" x="62" y="514" class="heading" font-size="22px" style="font-size:22px">Fix ownership and mode</text>
<text id="text-21" x="62" y="548" class="body">sudo chown selects your user and group.</text>
<text id="text-22" x="62" y="573" class="body">chmod 600 restricts access to the copy.</text>
<rect x="40" y="670" width="1120" height="125" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-24" x="62" y="704" class="heading" font-size="22px" style="font-size:22px">Select the copy in this shell</text>
<text id="text-25" x="62" y="738" class="body">export KUBECONFIG=&quot;$HOME/.kube/config&quot;</text>
<text id="text-26" x="62" y="763" class="body">kubectl and Helm now use your private client configuration.</text>
<rect x="40" y="835" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-28" x="60" y="865" class="body">The copy controls access to the same cluster. Mode 600 permits only its owner to read or write the file.</text>
</svg>
