<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title description">
<title id="title">Certificate issuance and browser TLS are separate</title>
<desc id="description">An annotated Ingress requests a certificate. cert-manager contacts Let&#x27;s Encrypt through ACME and serves a temporary HTTP-01 token route through Traefik on port 80. Successful domain validation permits certificate issuance. cert-manager stores the certificate with its locally generated private key in a Secret. Later Traefik loads that material for browser TLS on port 443, proves possession of the key during the handshake, and forwards a separate HTTP request to the application.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="1140" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Certificate issuance and browser TLS are separate</text>
<text id="text-2" x="40" y="83" class="muted">First prove domain control; later authenticate the HTTPS endpoint to a browser.</text>
<text id="text-3" x="40" y="135" class="heading" font-size="22px" style="font-size:22px">1. Issuance: ACME and domain control</text>
<rect x="40" y="170" width="300" height="180" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-5" x="62" y="204" class="heading" font-size="22px" style="font-size:22px">Application Ingress</text>
<text id="text-6" x="62" y="238" class="body">Names the domain, issuer,</text>
<text id="text-7" x="62" y="263" class="body">and TLS Secret.</text>
<rect x="440" y="170" width="320" height="180" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-9" x="462" y="204" class="heading" font-size="22px" style="font-size:22px">cert-manager</text>
<text id="text-10" x="462" y="238" class="body">Manages validation, signing</text>
<text id="text-11" x="462" y="263" class="body">requests, and renewal.</text>
<rect x="860" y="170" width="300" height="180" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-13" x="882" y="204" class="heading" font-size="22px" style="font-size:22px">Let&#x27;s Encrypt</text>
<text id="text-14" x="882" y="238" class="body">Validates domain control.</text>
<text id="text-15" x="882" y="263" class="body">Signs the certificate.</text>
<path d="M340 260 L440 260" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M760 235 L860 235" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M860 300 L760 300" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1010 350 L1010 470" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="912.8" y="399" width="194.4" height="30" fill="#fff"/>
<text id="text-21" x="1010" y="420" class="body" text-anchor="middle">HTTP-01 on port 80</text>
<rect x="860" y="470" width="300" height="180" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-23" x="882" y="504" class="heading" font-size="22px" style="font-size:22px">Solver on your VM</text>
<text id="text-24" x="882" y="538" class="body">On VM: Traefik + solver</text>
<text id="text-25" x="882" y="563" class="body">Pod.</text>
<text id="text-26" x="882" y="588" class="body">Serves the requested</text>
<text id="text-27" x="882" y="613" class="body">token.</text>
<rect x="440" y="470" width="320" height="180" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-29" x="462" y="504" class="heading" font-size="22px" style="font-size:22px">TLS Secret</text>
<text id="text-30" x="462" y="538" class="body">Certificate + private key.</text>
<text id="text-31" x="462" y="563" class="body">In the Ingress namespace.</text>
<path d="M600 350 L600 470" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="611.6" y="414" width="76.80000000000001" height="30" fill="#fff"/>
<text id="text-34" x="650" y="435" class="body" text-anchor="middle">Stores</text>
<text id="text-35" x="40" y="725" class="heading" font-size="22px" style="font-size:22px">2. Later: the browser visits HTTPS</text>
<rect x="40" y="770" width="300" height="180" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-37" x="62" y="804" class="heading" font-size="22px" style="font-size:22px">Browser</text>
<text id="text-38" x="62" y="838" class="body">Checks domain and CA</text>
<text id="text-39" x="62" y="863" class="body">trust.</text>
<text id="text-40" x="62" y="888" class="body">Establishes protected</text>
<text id="text-41" x="62" y="913" class="body">HTTP.</text>
<rect x="440" y="770" width="320" height="180" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-43" x="462" y="804" class="heading" font-size="22px" style="font-size:22px">Traefik</text>
<text id="text-44" x="462" y="838" class="body">Loads TLS material.</text>
<text id="text-45" x="462" y="863" class="body">Proves possession of the</text>
<text id="text-46" x="462" y="888" class="body">key.</text>
<text id="text-47" x="462" y="913" class="body">Terminates browser TLS.</text>
<rect x="860" y="770" width="300" height="180" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-49" x="882" y="804" class="heading" font-size="22px" style="font-size:22px">Application Pod</text>
<text id="text-50" x="882" y="838" class="body">Receives separate HTTP</text>
<text id="text-51" x="882" y="863" class="body">through its Service.</text>
<text id="text-52" x="882" y="888" class="body">Nginx listens on port 80.</text>
<path d="M600 650 L600 770" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="583.4" y="669" width="253.20000000000002" height="30" fill="#fff"/>
<text id="text-55" x="710" y="690" class="body" text-anchor="middle">Load certificate and key</text>
<path d="M340 860 L440 860" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="346.7" y="814" width="86.60000000000001" height="30" fill="#fff"/>
<text id="text-58" x="390" y="835" class="body" text-anchor="middle">TLS 443</text>
<path d="M760 860 L860 860" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="766.7" y="814" width="86.60000000000001" height="30" fill="#fff"/>
<text id="text-61" x="810" y="835" class="body" text-anchor="middle">HTTP 80</text>
<rect x="40" y="1010" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-63" x="60" y="1040" class="body">The private key is not sent to the browser or to Let&#x27;s Encrypt. A trusted certificate does not log a user in.</text>
</svg>
