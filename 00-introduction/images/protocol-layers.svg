<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title description">
<title id="title">Each protocol layer answers one question</title>
<desc id="description">HTTP defines request and response semantics. TLS provides authentication and confidentiality for the connection. TCP provides an ordered byte stream; QUIC provides reliable ordered streams over UDP and integrates TLS. IP routes packets, while link technologies carry frames across individual hops.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="710" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Each protocol layer answers one question</text>
<text id="text-2" x="40" y="83" class="muted">Conceptual responsibilities; HTTP/3 integrates TLS with QUIC rather than layering it over TCP.</text>
<rect x="40" y="140" width="240" height="78" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-3" x="62" y="174" class="heading" font-size="22px" style="font-size:22px">HTTP</text>
<rect x="300" y="140" width="560" height="78" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-4" x="322" y="174" class="body">What is being asked for, and what is the answer?</text>
<rect x="880" y="140" width="280" height="78" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-5" x="902" y="174" class="body">Methods, paths, status</text>
<text id="text-6" x="902" y="199" class="body">codes, headers</text>
<rect x="40" y="232" width="240" height="78" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-7" x="62" y="266" class="heading" font-size="22px" style="font-size:22px">TLS</text>
<rect x="300" y="232" width="560" height="78" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-8" x="322" y="266" class="body">Is this the real server, and can anyone read this?</text>
<rect x="880" y="232" width="280" height="78" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-9" x="902" y="266" class="body">Certificates, encryption</text>
<text id="text-10" x="902" y="291" class="body">(TLS 1.3)</text>
<rect x="40" y="324" width="240" height="78" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-11" x="62" y="358" class="heading" font-size="22px" style="font-size:22px">TCP or QUIC</text>
<rect x="300" y="324" width="560" height="78" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-12" x="322" y="358" class="body">TCP orders a byte stream; QUIC orders each stream.</text>
<rect x="880" y="324" width="280" height="78" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-13" x="902" y="358" class="body">Ports, retransmission</text>
<rect x="40" y="416" width="240" height="78" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-14" x="62" y="450" class="heading" font-size="22px" style="font-size:22px">IP</text>
<rect x="300" y="416" width="560" height="78" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-15" x="322" y="450" class="body">Which machine should this packet reach?</text>
<rect x="880" y="416" width="280" height="78" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-16" x="902" y="450" class="body">IP addresses, routing</text>
<rect x="40" y="508" width="240" height="78" rx="14" fill="#f4f6f8" stroke="#c3ccd5" stroke-width="2"/>
<text id="text-17" x="62" y="542" class="heading" font-size="22px" style="font-size:22px">Link</text>
<rect x="300" y="508" width="560" height="78" rx="14" fill="#f4f6f8" stroke="#c3ccd5" stroke-width="2"/>
<text id="text-18" x="322" y="542" class="body">How does the signal cross this one cable or radio hop?</text>
<rect x="880" y="508" width="280" height="78" rx="14" fill="#f4f6f8" stroke="#c3ccd5" stroke-width="2"/>
<text id="text-19" x="902" y="542" class="body">Wi-Fi, Ethernet</text>
<rect x="40" y="620" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-20" x="60" y="650" class="body">HTTP/1.1 and HTTP/2 use TCP. HTTP/3 uses QUIC over UDP, with TLS integrated into QUIC.</text>
</svg>
