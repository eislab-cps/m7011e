<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="831" viewBox="0 0 1200 831" role="img" aria-labelledby="title description">
<title id="title">Cloud regions can contain multiple availability zones</title>
<desc id="description">A cloud region can offer several availability zones designed to limit correlated infrastructure failures. Multiple application copies can improve availability if routing, spare capacity, and data replication support failover. The picture is one deployment example, not a guarantee that every provider region has this arrangement.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="831" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Cloud regions can contain multiple availability zones</text>
<text id="text-2" x="40" y="83" class="muted">Copies in distinct zones can improve availability when capacity, data, and routing support failover.</text>
<rect x="450" y="140" width="300" height="111" rx="14" fill="#f4f6f8" stroke="#c3ccd5" stroke-width="2"/>
<text id="text-3" x="472" y="174" class="heading" font-size="22px" style="font-size:22px">Users</text>
<text id="text-4" x="472" y="208" class="body">Requests from the internet</text>
<rect x="40" y="301" width="1120" height="400" rx="14" fill="#f4f6f8" stroke="#c3ccd5" stroke-width="2"/>
<text id="text-5" x="62" y="335" class="heading" font-size="22px" style="font-size:22px">Region eu-north-1 (Stockholm)</text>
<rect x="70" y="371" width="1060" height="111" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-6" x="92" y="405" class="heading" font-size="22px" style="font-size:22px">Load balancer</text>
<text id="text-7" x="92" y="439" class="body">Sends each request to a healthy copy in any zone</text>
<path d="M600.0 251.0 L600.0 371.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="70" y="532" width="340" height="150" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-8" x="92" y="566" class="heading" font-size="22px" style="font-size:22px">Zone A</text>
<text id="text-9" x="92" y="600" class="body">Own power, cooling and network.</text>
<text id="text-10" x="92" y="625" class="body">App copy + database replica</text>
<path d="M240.0 482.0 L240.0 532.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="430" y="532" width="340" height="150" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-11" x="452" y="566" class="heading" font-size="22px" style="font-size:22px">Zone B</text>
<text id="text-12" x="452" y="600" class="body">Own power, cooling and network.</text>
<text id="text-13" x="452" y="625" class="body">App copy + database replica</text>
<path d="M600.0 482.0 L600.0 532.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="790" y="532" width="340" height="150" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-14" x="812" y="566" class="heading" font-size="22px" style="font-size:22px">Zone C</text>
<text id="text-15" x="812" y="600" class="body">Own power, cooling and network.</text>
<text id="text-16" x="812" y="625" class="body">App copy + database replica</text>
<path d="M960.0 482.0 L960.0 532.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="741" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-17" x="60" y="771" class="body">Zones protect against a data-centre failure; a second region protects against losing a whole region.</text>
</svg>
