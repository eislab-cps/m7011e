<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="747" viewBox="0 0 1200 747" role="img" aria-labelledby="title description">
<title id="title">Cloud service models differ in who manages what</title>
<desc id="description">With your own server you manage everything from hardware to application. With infrastructure as a service you rent virtual machines and manage the operating system upward. With platform as a service you supply the application and its data. With functions as a service you supply single functions that run on demand. With software as a service you only use the finished application.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="747" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Cloud service models differ in who manages what</text>
<text id="text-2" x="40" y="83" class="muted">Each column is a service model; green rows are managed by you, grey rows by the provider.</text>
