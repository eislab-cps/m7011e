<text id="text-38" x="40" y="608" class="muted" text-anchor="start" font-size="16px" style="font-size:16px">Green: you manage it.   Grey: the provider manages it.</text>
<rect x="40" y="632" width="1120" height="85" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-39" x="60" y="662" class="body">Moving right means less to operate and less control. Security of your code, data and access rules always stays</text>
<text id="text-40" x="60" y="687" class="body">with you.</text>
