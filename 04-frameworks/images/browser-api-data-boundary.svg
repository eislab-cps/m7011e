<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="499" viewBox="0 0 1200 499" role="img" aria-labelledby="title description">
<title id="title">Browser and server code have different authority</title>
<desc id="description">Frontend code is delivered to the user, so hiding a button cannot enforce a data-access rule. The backend must decide whether the caller may perform each operation before accessing data. UI libraries and server frameworks exist to organize different work on opposite sides of this boundary; choosing the same programming language does not remove the boundary.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="499" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Browser and server code have different authority</text>
<text id="text-2" x="40" y="83" class="muted">Arrows follow a request toward its data; the response travels back to the browser.</text>
<rect x="40.0" y="150" width="320.0" height="199" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-4" x="62.0" y="184" class="heading" font-size="22px" style="font-size:22px">Browser UI</text>
<text id="text-5" x="62.0" y="218" class="body">Displays state and handles</text>
<text id="text-6" x="62.0" y="243" class="body">user input.</text>
<text id="text-7" x="62.0" y="268" class="body">Sends HTTP requests using</text>
<text id="text-8" x="62.0" y="293" class="body">the public API contract.</text>
<rect x="440.0" y="150" width="320.0" height="199" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-10" x="462.0" y="184" class="heading" font-size="22px" style="font-size:22px">Backend handler</text>
<text id="text-11" x="462.0" y="218" class="body">Validates input and checks</text>
<text id="text-12" x="462.0" y="243" class="body">permissions.</text>
<text id="text-13" x="462.0" y="268" class="body">Runs the business operation</text>
<text id="text-14" x="462.0" y="293" class="body">and forms a response.</text>
<path d="M360.0 249.5 L440.0 249.5" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="840.0" y="150" width="320.0" height="199" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-17" x="862.0" y="184" class="heading" font-size="22px" style="font-size:22px">Application data</text>
<text id="text-18" x="862.0" y="218" class="body">Accessed through the</text>
<text id="text-19" x="862.0" y="243" class="body">backend&#x27;s data model.</text>
<text id="text-20" x="862.0" y="268" class="body">Not exposed by giving the</text>
<text id="text-21" x="862.0" y="293" class="body">browser database</text>
<text id="text-22" x="862.0" y="318" class="body">credentials.</text>
<path d="M760.0 249.5 L840.0 249.5" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="409" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-25" x="60" y="439" class="body">The API contract connects implementations; it does not make the browser a trusted server.</text>
</svg>
