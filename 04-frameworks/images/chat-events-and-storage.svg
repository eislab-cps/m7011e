<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="499" viewBox="0 0 1200 499" role="img" aria-labelledby="title description">
<title id="title">Chat combines live events with durable history</title>
<desc id="description">Repeated HTTP polling is one way to discover new messages; a persistent event connection can reduce repeated request overhead and deliver updates promptly. That connection is not message durability. If a client disconnects, the application still needs rules for stored history, missed events, and duplicate handling. Socket.IO is an additional protocol and library ecosystem, not simply another name for raw WebSocket.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="499" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Chat combines live events with durable history</text>
<text id="text-2" x="40" y="83" class="muted">Live communication and stored history solve different requirements.</text>
<rect x="40.0" y="150" width="320.0" height="199" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-4" x="62.0" y="184" class="heading" font-size="22px" style="font-size:22px">Connected browser</text>
<text id="text-5" x="62.0" y="218" class="body">Receives and sends live</text>
<text id="text-6" x="62.0" y="243" class="body">chat events.</text>
<text id="text-7" x="62.0" y="268" class="body">Also needs a way to recover</text>
<text id="text-8" x="62.0" y="293" class="body">missed history.</text>
<rect x="440.0" y="150" width="320.0" height="199" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-10" x="462.0" y="184" class="heading" font-size="22px" style="font-size:22px">Chat service</text>
<text id="text-11" x="462.0" y="218" class="body">Manages connections, rooms,</text>
<text id="text-12" x="462.0" y="243" class="body">and authorization.</text>
<text id="text-13" x="462.0" y="268" class="body">Can use Socket.IO with its</text>
<text id="text-14" x="462.0" y="293" class="body">matching client protocol.</text>
<path d="M360.0 249.5 L440.0 249.5" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="840.0" y="150" width="320.0" height="199" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-17" x="862.0" y="184" class="heading" font-size="22px" style="font-size:22px">History and presence</text>
<text id="text-18" x="862.0" y="218" class="body">A database stores messages</text>
<text id="text-19" x="862.0" y="243" class="body">according to the design.</text>
<text id="text-20" x="862.0" y="268" class="body">Presence or cached state</text>
<text id="text-21" x="862.0" y="293" class="body">needs expiry and recovery</text>
<text id="text-22" x="862.0" y="318" class="body">rules.</text>
<path d="M760.0 249.5 L840.0 249.5" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="409" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-25" x="60" y="439" class="body">A connected socket is not proof that a message was stored or displayed.</text>
</svg>
