<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title description">
<title id="title">React: trigger, render, commit, then display</title>
<desc id="description">A state update triggers React rendering. Component functions compute the desired UI, reconciliation identifies updates, and the commit changes the DOM if necessary. The browser then performs style, layout, and paint work as needed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="810" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">React: trigger, render, commit, then display</text>
<text id="text-2" x="40" y="83" class="muted">Rendering computes a desired UI; committing changes the actual DOM when needed.</text>
<rect x="40" y="145" width="320" height="230" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-4" x="62" y="179" class="heading" font-size="22px" style="font-size:22px">1. Trigger</text>
<text id="text-5" x="62" y="213" class="body">Initial load or a state</text>
<text id="text-6" x="62" y="238" class="body">update schedules rendering.</text>
<rect x="440" y="145" width="320" height="230" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-8" x="462" y="179" class="heading" font-size="22px" style="font-size:22px">2. Render</text>
<text id="text-9" x="462" y="213" class="body">Call component functions.</text>
<text id="text-10" x="462" y="238" class="body">Compute the desired UI from</text>
<text id="text-11" x="462" y="263" class="body">state and props.</text>
<path d="M360 260 L440 260" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="840" y="145" width="320" height="230" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-14" x="862" y="179" class="heading" font-size="22px" style="font-size:22px">3. Commit</text>
<text id="text-15" x="862" y="213" class="body">Reconcile results. Apply</text>
<text id="text-16" x="862" y="238" class="body">required DOM changes, if</text>
<text id="text-17" x="862" y="263" class="body">any.</text>
<path d="M760 260 L840 260" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1000 375 V430 H600 V485" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="485" width="1120" height="125" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-21" x="62" y="519" class="heading" font-size="22px" style="font-size:22px">Browser display</text>
<text id="text-22" x="62" y="553" class="body">Style calculation, layout, and paint depend on what changed. The browser can batch work.</text>
<rect x="40" y="670" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-24" x="60" y="700" class="body">A component can render without a DOM change. Updating state does not automatically write to an API.</text>
</svg>
