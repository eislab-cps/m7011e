<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="718" viewBox="0 0 1200 718" role="img" aria-labelledby="title description">
<title id="title">Choose frontend facilities from the interaction you need</title>
<desc id="description">Different frontend tools exist because applications range from a mostly static page to a large interactive system. A compiler, a runtime UI library, and an application framework make different choices about when work happens and which conventions are included. None guarantees that a page loads quickly: bundle contents, data access, rendering work, and network conditions also matter.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="718" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Choose frontend facilities from the interaction you need</text>
<text id="text-2" x="40" y="83" class="muted">These questions identify required capabilities instead of mapping every requirement to one brand.</text>
<rect x="40.0" y="150" width="352.0" height="200" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-4" x="62.0" y="184" class="heading" font-size="22px" style="font-size:22px">A little interactivity</text>
<text id="text-5" x="62.0" y="218" class="body">Can existing HTML and a small</text>
<text id="text-6" x="62.0" y="243" class="body">script do the job?</text>
<text id="text-7" x="62.0" y="268" class="body">Avoid extra state and build</text>
<text id="text-8" x="62.0" y="293" class="body">machinery without a reason.</text>
<rect x="424.0" y="150" width="352.0" height="200" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-10" x="446.0" y="184" class="heading" font-size="22px" style="font-size:22px">Stateful browser UI</text>
<text id="text-11" x="446.0" y="218" class="body">Do several views depend on</text>
<text id="text-12" x="446.0" y="243" class="body">changing state?</text>
<text id="text-13" x="446.0" y="268" class="body">Compare components, state</text>
<text id="text-14" x="446.0" y="293" class="body">handling, and team</text>
<text id="text-15" x="446.0" y="318" class="body">familiarity.</text>
<rect x="808.0" y="150" width="352.0" height="200" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-17" x="830.0" y="184" class="heading" font-size="22px" style="font-size:22px">Routing and rendering</text>
<text id="text-18" x="830.0" y="218" class="body">Need route-based data loading</text>
<text id="text-19" x="830.0" y="243" class="body">or server-rendered HTML?</text>
<text id="text-20" x="830.0" y="268" class="body">Evaluate application</text>
<text id="text-21" x="830.0" y="293" class="body">frameworks as well as UI</text>
<text id="text-22" x="830.0" y="318" class="body">libraries.</text>
<rect x="40.0" y="382" width="352.0" height="200" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-24" x="62.0" y="416" class="heading" font-size="22px" style="font-size:22px">Shared team structure</text>
<text id="text-25" x="62.0" y="450" class="body">Need consistent forms,</text>
<text id="text-26" x="62.0" y="475" class="body">dependency injection, and</text>
<text id="text-27" x="62.0" y="500" class="body">conventions?</text>
<text id="text-28" x="62.0" y="525" class="body">Compare built-in facilities</text>
<text id="text-29" x="62.0" y="550" class="body">with assembled libraries.</text>
<rect x="424.0" y="382" width="352.0" height="200" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-31" x="446.0" y="416" class="heading" font-size="22px" style="font-size:22px">Heavy browser</text>
<text id="text-32" x="446.0" y="442" class="heading" font-size="22px" style="font-size:22px">computation</text>
<text id="text-33" x="446.0" y="476" class="body">Is a measured hot path</text>
<text id="text-34" x="446.0" y="501" class="body">CPU-intensive?</text>
<text id="text-35" x="446.0" y="526" class="body">Evaluate workers or WASM,</text>
<text id="text-36" x="446.0" y="551" class="body">including data-transfer costs.</text>
<rect x="808.0" y="382" width="352.0" height="200" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-38" x="830.0" y="416" class="heading" font-size="22px" style="font-size:22px">Web and native clients</text>
<text id="text-39" x="830.0" y="450" class="body">Which UI and device APIs must</text>
<text id="text-40" x="830.0" y="475" class="body">each client support?</text>
<text id="text-41" x="830.0" y="500" class="body">Sharing concepts is different</text>
<text id="text-42" x="830.0" y="525" class="body">from sharing every screen.</text>
<rect x="40" y="628" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-44" x="60" y="658" class="body">Compare a small working feature and its maintenance cost rather than choosing by slogan.</text>
</svg>
