<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="616" viewBox="0 0 1200 616" role="img" aria-labelledby="title description">
<title id="title">A game backend has several kinds of state and timing</title>
<desc id="description">A game simulation loop, an account API, and a leaderboard are different workloads, so one deployment or technology does not have to serve all of them. A fast simulation implementation cannot eliminate internet delay, and a WebAssembly client does not imply a particular network latency. Start with a measured update budget and distinguish temporary session state from progress that must survive a restart.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="616" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">A game backend has several kinds of state and timing</text>
<text id="text-2" x="40" y="83" class="muted">Responsibilities are illustrative; tick rates and latency targets require a specified workload.</text>
<rect x="40.0" y="150" width="544.0" height="149" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-4" x="62.0" y="184" class="heading" font-size="22px" style="font-size:22px">Simulation loop</text>
<text id="text-5" x="62.0" y="218" class="body">Advances game state under a time budget.</text>
<text id="text-6" x="62.0" y="243" class="body">Needs measured processing and network behavior.</text>
<rect x="616.0" y="150" width="544.0" height="149" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-8" x="638.0" y="184" class="heading" font-size="22px" style="font-size:22px">Connected client</text>
<text id="text-9" x="638.0" y="218" class="body">Displays updates and sends player input.</text>
<text id="text-10" x="638.0" y="243" class="body">Must handle delay, disconnects, and</text>
<text id="text-11" x="638.0" y="268" class="body">reconciliation.</text>
<rect x="40.0" y="331" width="544.0" height="149" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-13" x="62.0" y="365" class="heading" font-size="22px" style="font-size:22px">Accounts and durable data</text>
<text id="text-14" x="62.0" y="399" class="body">Stores profiles and persistent progress.</text>
<text id="text-15" x="62.0" y="424" class="body">Uses explicit authentication and authorization.</text>
<rect x="616.0" y="331" width="544.0" height="149" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-17" x="638.0" y="365" class="heading" font-size="22px" style="font-size:22px">Matchmaking and ranking</text>
<text id="text-18" x="638.0" y="399" class="body">Queues compatible players and evaluates results.</text>
<text id="text-19" x="638.0" y="424" class="body">Defines consistency, fairness, and recovery rules.</text>
<rect x="40" y="526" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-21" x="60" y="556" class="body">A framework label does not guarantee a frame rate, a tick budget, or a network round trip.</text>
</svg>
