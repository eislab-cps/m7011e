<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
<title id="title">One framework, different deployment boundaries</title>
<desc id="description">On the left, Todo and Reminder are modules in one Flask application and release together. On the right, Todo and Reminder run as separately deployed Flask services and communicate through HTTP or messages. The framework is the same; the architectural boundary differs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="820" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">One framework, different deployment boundaries</text>
<text id="text-2" x="40" y="83" class="muted">Choosing Flask does not decide whether responsibilities share a release or a network boundary.</text>
<rect x="40" y="140" width="540" height="500" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-4" x="62" y="183" class="heading">One application release</text>
<rect x="620" y="140" width="540" height="500" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-6" x="642" y="183" class="heading">Separate service releases</text>
<rect x="65" y="240" width="490" height="270" rx="14" fill="#fff" stroke="#adc5df" stroke-width="2"/>
<text id="text-8" x="87" y="280" class="heading">One Flask application</text>
<rect x="85" y="320" width="190" height="130" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-10" x="107" y="354" class="heading" font-size="22px" style="font-size:22px">Todos</text>
<text id="text-11" x="107" y="388" class="body">Module interface.</text>
<rect x="325" y="320" width="205" height="130" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-13" x="347" y="354" class="heading" font-size="22px" style="font-size:22px">Reminders</text>
<text id="text-14" x="347" y="388" class="body">Module interface.</text>
<path d="M275 385 L325 385" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text id="text-16" x="87" y="486" class="body" font-size="17px" style="font-size:17px">In-process calls; one deployable application.</text>
<rect x="650" y="230" width="480" height="135" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-18" x="672" y="264" class="heading" font-size="22px" style="font-size:22px">Flask Todo service</text>
<text id="text-19" x="672" y="298" class="body">Owns the todo capability and data.</text>
<path d="M890 365 L890 460" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="802.6" y="399" width="174.8" height="30" fill="#fff"/>
<text id="text-22" x="890" y="420" class="body" text-anchor="middle">HTTP or messages</text>
<rect x="650" y="460" width="480" height="135" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-24" x="672" y="494" class="heading" font-size="22px" style="font-size:22px">Flask Reminder service</text>
<text id="text-25" x="672" y="528" class="body">Owns reminder scheduling and state.</text>
<rect x="40" y="695" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-27" x="60" y="725" class="body">Modules need explicit interfaces. Independent services also need compatible contracts and owned data.</text>
</svg>
