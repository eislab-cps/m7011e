<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="616" viewBox="0 0 1200 616" role="img" aria-labelledby="title description">
<title id="title">A trading example starts with correctness and latency budgets</title>
<desc id="description">This is an illustrative workload decomposition, not a production trading specification or a framework benchmark. Different paths have different correctness and latency needs. A lower-overhead runtime can be relevant on a measured hot path, but a language name cannot guarantee a request rate, market-data freshness, or end-to-end deadline. Network, storage, queueing, and recovery behavior all belong in the evaluation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="616" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">A trading example starts with correctness and latency budgets</text>
<text id="text-2" x="40" y="83" class="muted">Cards identify constraints that must be measured and designed; no throughput guarantee is implied.</text>
<rect x="40.0" y="150" width="544.0" height="149" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-4" x="62.0" y="184" class="heading" font-size="22px" style="font-size:22px">Market data</text>
<text id="text-5" x="62.0" y="218" class="body">Handle ordered updates, backpressure, and</text>
<text id="text-6" x="62.0" y="243" class="body">reconnects.</text>
<text id="text-7" x="62.0" y="268" class="body">Measure freshness from the upstream source.</text>
<rect x="616.0" y="150" width="544.0" height="149" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-9" x="638.0" y="184" class="heading" font-size="22px" style="font-size:22px">Order processing</text>
<text id="text-10" x="638.0" y="218" class="body">Define accepted, rejected, and completed states.</text>
<text id="text-11" x="638.0" y="243" class="body">Preserve identifiers and recovery information.</text>
<rect x="40.0" y="331" width="544.0" height="149" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-13" x="62.0" y="365" class="heading" font-size="22px" style="font-size:22px">Risk checks</text>
<text id="text-14" x="62.0" y="399" class="body">Make required limits hold under concurrency.</text>
<text id="text-15" x="62.0" y="424" class="body">Define behavior if a dependency is unavailable.</text>
<rect x="616.0" y="331" width="544.0" height="149" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-17" x="638.0" y="365" class="heading" font-size="22px" style="font-size:22px">Accounts and analytics</text>
<text id="text-18" x="638.0" y="399" class="body">Separate interactive identity work from analysis.</text>
<text id="text-19" x="638.0" y="424" class="body">Choose storage and pipelines for their queries.</text>
<rect x="40" y="526" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-21" x="60" y="556" class="body">Choose technologies after defining the operation, failure behavior, and measurable budget.</text>
</svg>
