<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title description">
<title id="title">One configured framework request path</title>
<desc id="description">An example request runs shared middleware, route selection and policies, application logic, and response handling. Middleware or route policies can reject a request before application logic. The business operation validates input and checks access to the particular record.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="1000" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">One configured framework request path</text>
<text id="text-2" x="40" y="83" class="muted">Example order only: middleware and hooks vary by framework and configuration.</text>
<rect x="40" y="140" width="680" height="150" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-4" x="62" y="174" class="heading" font-size="22px" style="font-size:22px">Shared middleware</text>
<text id="text-5" x="62" y="208" class="body">For example: logging, limits, and body parsing.</text>
<path d="M380 290 L380 330" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="330" width="680" height="150" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-8" x="62" y="364" class="heading" font-size="22px" style="font-size:22px">Routing and route policies</text>
<text id="text-9" x="62" y="398" class="body">Match method and path. Apply configured credentials and</text>
<text id="text-10" x="62" y="423" class="body">policies.</text>
<path d="M380 480 L380 520" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="520" width="680" height="150" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-13" x="62" y="554" class="heading" font-size="22px" style="font-size:22px">Application operation</text>
<text id="text-14" x="62" y="588" class="body">Validate input, check record ownership, and change state.</text>
<path d="M380 670 L380 710" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="710" width="680" height="150" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-17" x="62" y="744" class="heading" font-size="22px" style="font-size:22px">Response handling</text>
<text id="text-18" x="62" y="778" class="body">Serialize success or error data. Set status and response</text>
<text id="text-19" x="62" y="803" class="body">headers.</text>
<rect x="840" y="330" width="320" height="180" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-21" x="862" y="364" class="heading" font-size="22px" style="font-size:22px">Early response</text>
<text id="text-22" x="862" y="398" class="body">A rejected request may</text>
<text id="text-23" x="862" y="423" class="body">return before the handler</text>
<text id="text-24" x="862" y="448" class="body">executes.</text>
<path d="M720 215 H1000 V330" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="900" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-27" x="60" y="930" class="body">Middleware can stop a request early. Authentication and CORS do not replace per-operation authorization.</text>
</svg>
