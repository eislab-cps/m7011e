<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="679" viewBox="0 0 1200 679" role="img" aria-labelledby="title description">
<title id="title">One site can combine rendering strategies</title>
<desc id="description">One application can serve prebuilt public help, generate request-specific content on a server, and use client rendering for an interactive dashboard. Route-level requirements determine freshness, authorization, and caching.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="679" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">One site can combine rendering strategies</text>
<text id="text-2" x="40" y="83" class="muted">These are example design choices, not automatic framework defaults.</text>
<rect x="40" y="150" width="1120" height="110" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-4" x="62" y="184" class="heading" font-size="22px" style="font-size:22px">Choose by route and data needs</text>
<text id="text-5" x="62" y="218" class="body">The first document, later navigation, and API authorization are separate decisions.</text>
<path d="M600 260 V310 H213.33333333333334 V360" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="360" width="346.6666666666667" height="149" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-8" x="62.0" y="394" class="heading" font-size="22px" style="font-size:22px">Public help: SSG</text>
<text id="text-9" x="62.0" y="428" class="body">Generate content before</text>
<text id="text-10" x="62.0" y="453" class="body">requests. Publish or</text>
<text id="text-11" x="62.0" y="478" class="body">regenerate changes.</text>
<path d="M600 260 V310 H600.0 V360" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="426.6666666666667" y="360" width="346.6666666666667" height="149" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-14" x="448.6666666666667" y="394" class="heading" font-size="22px" style="font-size:22px">Personal page: SSR</text>
<text id="text-15" x="448.6666666666667" y="428" class="body">Render authorized content for</text>
<text id="text-16" x="448.6666666666667" y="453" class="body">the request. Set its cache</text>
<text id="text-17" x="448.6666666666667" y="478" class="body">policy.</text>
<path d="M600 260 V310 H986.6666666666667 V360" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="813.3333333333334" y="360" width="346.6666666666667" height="149" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-20" x="835.3333333333334" y="394" class="heading" font-size="22px" style="font-size:22px">Dashboard: CSR</text>
<text id="text-21" x="835.3333333333334" y="428" class="body">Load code and authorized data.</text>
<text id="text-22" x="835.3333333333334" y="453" class="body">Design loading and error</text>
<text id="text-23" x="835.3333333333334" y="478" class="body">states.</text>
<rect x="40" y="561" width="1120" height="88" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-25" x="60" y="591" class="body">The browser can use client navigation after any initial strategy. Keep private data out of public cache</text>
<text id="text-26" x="60" y="619" class="body">entries.</text>
</svg>
