<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="766" viewBox="0 0 1200 766" role="img" aria-labelledby="title description">
<title id="title">kubectl reads a local file, then asks a remote API</title>
<desc id="description">The KUBECONFIG variable selects a kubeconfig file in the current shell. Its current context names a cluster entry with the API server address, a user entry with credentials, and optionally a namespace. kubectl sends an HTTPS request with those credentials to the API server, which for the course cluster is usually reached through Rancher. The server first authenticates the caller, then checks permissions with RBAC; an unknown caller gets 401 Unauthorized, a known caller without permission gets 403 Forbidden, and an unreachable address results in a timeout. Only allowed requests change stored state, which controllers and node agents then carry out.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="766" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">kubectl reads a local file, then asks a remote API</text>
<text id="text-2" x="40" y="83" class="muted">Left: everything on your laptop. Right: what the cluster checks before acting.</text>
<rect x="40" y="125" width="520" height="136" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-3" x="62" y="159" class="heading" font-size="22px" style="font-size:22px">Your shell</text>
<text id="text-4" x="62" y="193" class="body">export KUBECONFIG=&quot;$HOME/.kube/m7011e.yaml&quot;</text>
<text id="text-5" x="62" y="218" class="body">Applies to this terminal only.</text>
<rect x="40" y="290" width="520" height="186" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-6" x="62" y="324" class="heading" font-size="22px" style="font-size:22px">kubeconfig file</text>
<text id="text-7" x="62" y="358" class="body">clusters: API server address (via Rancher)</text>
<text id="text-8" x="62" y="383" class="body">users: your credentials</text>
<text id="text-9" x="62" y="408" class="body">contexts: cluster + user + namespace</text>
<text id="text-10" x="62" y="433" class="body">current-context: which one kubectl uses</text>
<rect x="40" y="525" width="520" height="111" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-11" x="62" y="559" class="heading" font-size="22px" style="font-size:22px">kubectl get nodes</text>
<text id="text-12" x="62" y="593" class="body">Builds an HTTPS request with those credentials.</text>
<rect x="640" y="125" width="520" height="136" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-13" x="662" y="159" class="heading" font-size="22px" style="font-size:22px">1 Authenticate</text>
<text id="text-14" x="662" y="193" class="body">Who is calling? Unknown credentials → 401</text>
<text id="text-15" x="662" y="218" class="body">Unauthorized.</text>
<rect x="640" y="290" width="520" height="111" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-16" x="662" y="324" class="heading" font-size="22px" style="font-size:22px">2 Authorize (RBAC)</text>
<text id="text-17" x="662" y="358" class="body">May this user do this here? No → 403 Forbidden.</text>
<rect x="640" y="455" width="520" height="111" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-18" x="662" y="489" class="heading" font-size="22px" style="font-size:22px">3 Read or store the request</text>
<text id="text-19" x="662" y="523" class="body">Controllers and node agents act on stored changes.</text>
<path d="M300.0 261.0 L300.0 290.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M300.0 476.0 L300.0 525.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M560 580.5 L600 580.5 L600 193.0 L640 193.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text id="text-20" x="590" y="612" class="muted" text-anchor="start" font-size="16px" style="font-size:16px">HTTPS</text>
<path d="M900.0 261.0 L900.0 290.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M900.0 401.0 L900.0 455.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="676" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-21" x="60" y="706" class="body">A timeout means the request never reached an answer; 401 and 403 mean it did, and the API rejected it.</text>
</svg>
