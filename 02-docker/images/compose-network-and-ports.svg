<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title description">
<title id="title">Host ports and Compose service names are different addresses</title>
<desc id="description">The browser runs on the host, so it reaches the containers through published ports: localhost:8080 for the frontend and localhost:8000 for the backend API. Containers on the Compose network todo-network resolve each other by service name, so a server process in another container would call http://backend:8000. The host browser cannot resolve the name backend.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="550" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Host ports and Compose service names are different addresses</text>
<text id="text-2" x="40" y="83" class="muted">Solid arrows use published host ports; the dashed arrow is how a process in one container reaches another.</text>
<rect x="40" y="150" width="300" height="250" rx="14" fill="#f4f6f8" stroke="#c3ccd5" stroke-width="2"/>
<text id="text-3" x="62" y="184" class="heading" font-size="22px" style="font-size:22px">Host machine</text>
<text id="text-4" x="62" y="218" class="body">Browser opens</text>
<text id="text-5" x="62" y="243" class="body">localhost:8080 and calls</text>
<text id="text-6" x="62" y="268" class="body">localhost:8000.</text>
<text id="text-7" x="62" y="293" class="body">Cannot resolve the name</text>
<text id="text-8" x="62" y="318" class="body">backend.</text>
<rect x="440" y="120" width="720" height="310" rx="18" fill="none" stroke="#9bceba" stroke-width="2" stroke-dasharray="10 7"/>
<text id="text-9" x="800" y="145" class="muted" text-anchor="middle" font-size="16px" style="font-size:16px">Compose network: todo-network</text>
<rect x="470" y="165" width="260" height="120" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-10" x="492" y="199" class="heading" font-size="22px" style="font-size:22px">frontend</text>
<text id="text-11" x="492" y="233" class="body">Listens on 8080</text>
<rect x="870" y="165" width="260" height="120" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-12" x="892" y="199" class="heading" font-size="22px" style="font-size:22px">backend</text>
<text id="text-13" x="892" y="233" class="body">Listens on 8000</text>
<path d="M340.0 205.0 L470.0 205.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text id="text-14" x="400" y="193" class="muted" text-anchor="middle" font-size="16px" style="font-size:16px">:8080</text>
<path d="M340 360 L1000 360 L1000 285" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text id="text-15" x="400" y="348" class="muted" text-anchor="middle" font-size="16px" style="font-size:16px">:8000</text>
<path d="M730.0 245.0 L870.0 245.0" fill="none" stroke="#1559a6" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text id="text-16" x="800" y="233" class="muted" text-anchor="middle" font-size="16px" style="font-size:16px">backend:8000</text>
<rect x="40" y="460" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-17" x="60" y="490" class="body">Inside a container, localhost means that container itself; use the service name to reach another container.</text>
</svg>
