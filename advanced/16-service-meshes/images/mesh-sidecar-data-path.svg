<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="882" viewBox="0 0 1200 882" role="img" aria-labelledby="title description">
<title id="title">A sidecar mesh intercepts eligible workload traffic</title>
<desc id="description">Repeating transport policy in every application library is operational work. A sidecar mesh moves selected routing, connection security, and telemetry behavior into managed proxies. The application does not normally rewrite its URL to localhost to use the proxy; interception handles eligible traffic. Workload mTLS identifies and protects the proxy-to-proxy connection, not the end user&#x27;s permission to modify an order.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="882" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">A sidecar mesh intercepts eligible workload traffic</text>
<text id="text-2" x="40" y="83" class="muted">Read the request path top to bottom; the control plane configures it but does not carry the payload.</text>
<rect x="40" y="150" width="1120" height="124" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-4" x="62" y="184" class="heading" font-size="22px" style="font-size:22px">Application A</text>
<text id="text-5" x="62" y="218" class="body">Makes an ordinary request to its intended destination.</text>
<text id="text-6" x="62" y="243" class="body">Configured interception sends eligible traffic through its proxy.</text>
<path d="M600 274 L600 306" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="306" width="1120" height="124" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-9" x="62" y="340" class="heading" font-size="22px" style="font-size:22px">Envoy proxy A</text>
<text id="text-10" x="62" y="374" class="body">Uses received routing and security configuration.</text>
<text id="text-11" x="62" y="399" class="body">Establishes workload-to-workload mTLS when applicable.</text>
<path d="M600 430 L600 462" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="462" width="1120" height="124" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-14" x="62" y="496" class="heading" font-size="22px" style="font-size:22px">Envoy proxy B</text>
<text id="text-15" x="62" y="530" class="body">Enforces the destination&#x27;s configured mesh policy.</text>
<text id="text-16" x="62" y="555" class="body">Forwards permitted traffic to application B.</text>
<path d="M600 586 L600 618" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="618" width="1120" height="124" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-19" x="62" y="652" class="heading" font-size="22px" style="font-size:22px">Application B</text>
<text id="text-20" x="62" y="686" class="body">Handles the business operation.</text>
<text id="text-21" x="62" y="711" class="body">Still needs its application permissions and data rules.</text>
<rect x="40" y="792" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-23" x="60" y="822" class="body">Which traffic is intercepted and which policies apply depends on the mesh configuration.</text>
</svg>
