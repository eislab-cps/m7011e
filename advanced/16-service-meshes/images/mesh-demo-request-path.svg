<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="524" viewBox="0 0 1200 524" role="img" aria-labelledby="title description">
<title id="title">The demo client and backend each have an application and proxy</title>
<desc id="description">The frontend in this exercise is a request-generating workload, not necessarily a human-facing web page. Its requests let you observe the proxy policies without changing backend application code. The mesh can choose versions according to weights or headers, but a short sample is not guaranteed to match the weights exactly. Browser-facing TLS and service-to-service mesh mTLS remain different connections.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="524" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">The demo client and backend each have an application and proxy</text>
<text id="text-2" x="40" y="83" class="muted">Arrows trace a test request through the configured mesh to one backend instance.</text>
<rect x="40.0" y="150" width="320.0" height="224" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-4" x="62.0" y="184" class="heading" font-size="22px" style="font-size:22px">Frontend test client</text>
<text id="text-5" x="62.0" y="218" class="body">Runs curl from its</text>
<text id="text-6" x="62.0" y="243" class="body">application container.</text>
<text id="text-7" x="62.0" y="268" class="body">Calls the backend Service</text>
<text id="text-8" x="62.0" y="293" class="body">name.</text>
<rect x="440.0" y="150" width="320.0" height="224" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-10" x="462.0" y="184" class="heading" font-size="22px" style="font-size:22px">Mesh routing</text>
<text id="text-11" x="462.0" y="218" class="body">Proxies use the active</text>
<text id="text-12" x="462.0" y="243" class="body">routing and transport</text>
<text id="text-13" x="462.0" y="268" class="body">policy.</text>
<text id="text-14" x="462.0" y="293" class="body">Weights or headers can</text>
<text id="text-15" x="462.0" y="318" class="body">select an eligible backend</text>
<text id="text-16" x="462.0" y="343" class="body">version.</text>
<path d="M360.0 262.0 L440.0 262.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="840.0" y="150" width="320.0" height="224" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-19" x="862.0" y="184" class="heading" font-size="22px" style="font-size:22px">Backend v1 or v2</text>
<text id="text-20" x="862.0" y="218" class="body">The selected application</text>
<text id="text-21" x="862.0" y="243" class="body">returns its response.</text>
<text id="text-22" x="862.0" y="268" class="body">Its proxy participates in</text>
<text id="text-23" x="862.0" y="293" class="body">the mesh connection.</text>
<path d="M760.0 262.0 L840.0 262.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="434" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-26" x="60" y="464" class="body">Identify the calling process and active policy before interpreting a routing experiment.</text>
</svg>
