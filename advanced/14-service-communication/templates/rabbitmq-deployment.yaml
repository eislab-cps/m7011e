apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-deployment
  labels:
    app: rabbitmq
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
     metadata:
       labels:
          app: rabbitmq
     spec:
         hostname: rabbitmq
         containers:
           - name: rabbitmq
             image: {{ .Values.Image | quote }} 
             imagePullPolicy: "Always"
             ports:
               - containerPort: 15672
               - containerPort: 5672
             envFrom:
               - secretRef:
                   name: rabbitmq-credentials

             volumeMounts:
               - name: rabbitmq-data
                 mountPath: /var/lib/rabbitmq
             readinessProbe:
               exec:
                 command: [rabbitmq-diagnostics, -q, ping]
               initialDelaySeconds: 20
               periodSeconds: 10
         volumes:
           - name: rabbitmq-data
             persistentVolumeClaim:
               claimName: rabbitmq-pvc
