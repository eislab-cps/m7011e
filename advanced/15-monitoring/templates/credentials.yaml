apiVersion: v1
kind: Secret
metadata:
  name: monitoring-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  grafana-user: {{ .Values.grafana.adminUser | quote }}
  grafana-password: {{ .Values.grafana.adminPassword | quote }}
  rabbitmq-user: {{ .Values.rabbitmq.user | quote }}
  rabbitmq-password: {{ .Values.rabbitmq.password | quote }}
