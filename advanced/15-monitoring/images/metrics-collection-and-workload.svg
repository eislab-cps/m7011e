<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title description">
<title id="title">Prometheus scrapes targets; Grafana queries Prometheus</title>
<desc id="description">The top arrows show who initiates monitoring requests: Grafana queries Prometheus, and Prometheus fetches metric samples from exporters. Measurements return in the responses. The bottom arrows are application workload, generated separately through HTTP and AMQP. Keeping these conversations distinct explains why a visible Grafana page does not establish that a target was scraped or that any application request succeeded.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="940" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Prometheus scrapes targets; Grafana queries Prometheus</text>
<text id="text-2" x="40" y="83" class="muted">Solid arrows show initiated requests or published work, not the reverse direction of returned data.</text>
<text id="text-3" x="40" y="132" class="heading">Monitoring HTTP requests</text>
<rect x="40" y="158" width="320" height="255" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-5" x="62" y="192" class="heading" font-size="22px" style="font-size:22px">Grafana</text>
<text id="text-6" x="62" y="226" class="body">Queries the Prometheus API.</text>
<text id="text-7" x="62" y="251" class="body">Renders the returned time</text>
<text id="text-8" x="62" y="276" class="body">series.</text>
<rect x="440" y="158" width="320" height="255" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-10" x="462" y="192" class="heading" font-size="22px" style="font-size:22px">Prometheus</text>
<text id="text-11" x="462" y="226" class="body">Initiates HTTP scrapes.</text>
<text id="text-12" x="462" y="251" class="body">Stores samples and</text>
<text id="text-13" x="462" y="276" class="body">evaluates queries.</text>
<path d="M360 278 L440 278" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="840" y="158" width="320" height="255" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-16" x="862" y="192" class="heading" font-size="22px" style="font-size:22px">Metric targets</text>
<text id="text-17" x="862" y="226" class="body">Order API :8001 /metrics</text>
<text id="text-18" x="862" y="251" class="body">Consumer :8000 /metrics</text>
<text id="text-19" x="862" y="276" class="body">RabbitMQ :15692 /metrics</text>
<path d="M760 278 L840 278" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text id="text-21" x="40" y="465" class="heading">Application workload: separate from monitoring</text>
<rect x="40" y="505" width="320" height="220" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-23" x="62" y="539" class="heading" font-size="22px" style="font-size:22px">Load generator</text>
<text id="text-24" x="62" y="573" class="body">Sends HTTP API requests.</text>
<text id="text-25" x="62" y="598" class="body">Also publishes AMQP</text>
<text id="text-26" x="62" y="623" class="body">messages.</text>
<rect x="740" y="500" width="420" height="116" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-28" x="762" y="534" class="heading" font-size="22px" style="font-size:22px">Order service</text>
<text id="text-29" x="762" y="568" class="body">Handles application HTTP requests.</text>
<rect x="740" y="675" width="420" height="140" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-31" x="762" y="709" class="heading" font-size="22px" style="font-size:22px">RabbitMQ → consumer</text>
<text id="text-32" x="762" y="743" class="body">Receives AMQP work.</text>
<text id="text-33" x="762" y="768" class="body">Delivers it to the worker.</text>
<path d="M360 565 H550 V558 H740" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="591.4" y="514" width="57.2" height="30" fill="#fff"/>
<text id="text-36" x="620" y="535" class="body" text-anchor="middle">HTTP</text>
<path d="M360 665 H550 V745 H740" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="591.4" y="701" width="57.2" height="30" fill="#fff"/>
<text id="text-39" x="620" y="722" class="body" text-anchor="middle">AMQP</text>
<rect x="40" y="855" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-41" x="60" y="885" class="body">Application traffic, metric exposition, collection, and visualization are separate operations.</text>
</svg>
