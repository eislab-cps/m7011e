<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title description">
<title id="title">Restarting, uninstalling, and deleting data are different operations</title>
<desc id="description">A recreated database Pod mounts its retained claim. The chart keeps the PVC on Helm uninstall. Deleting the PVC makes the reclaim policy important: Delete can remove the underlying storage, while Retain preserves the volume for manual handling. Claims in use may remain pending deletion until no longer mounted.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="690" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Restarting, uninstalling, and deleting data are different operations</text>
<text id="text-2" x="40" y="83" class="muted">Read each column top to bottom: the action, what Kubernetes removes, and what survives.</text>
<rect x="40" y="125" width="350" height="130" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-3" x="62" y="159" class="heading" font-size="22px" style="font-size:22px">Pod restart</text>
<text id="text-4" x="62" y="193" class="code">kubectl delete pod</text>
<text id="text-5" x="62" y="218" class="code">postgres-statefulset-0</text>
<rect x="40" y="300" width="350" height="110" rx="14" fill="#f4f6f8" stroke="#c3ccd5" stroke-width="2"/>
<text id="text-6" x="62" y="334" class="heading" font-size="22px" style="font-size:22px">Removes</text>
<text id="text-7" x="62" y="368" class="body">Only the Pod. The StatefulSet</text>
<text id="text-8" x="62" y="393" class="body">recreates it.</text>
<rect x="40" y="450" width="350" height="110" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-9" x="62" y="484" class="heading" font-size="22px" style="font-size:22px">Result</text>
<text id="text-10" x="62" y="518" class="body">Claim and rows survive.</text>
<path d="M215.0 255.0 L215.0 300.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M215.0 410.0 L215.0 450.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="425" y="125" width="350" height="130" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-11" x="447" y="159" class="heading" font-size="22px" style="font-size:22px">helm uninstall</text>
<text id="text-12" x="447" y="193" class="code">helm uninstall</text>
<text id="text-13" x="447" y="218" class="code">postgresql -n db</text>
<rect x="425" y="300" width="350" height="110" rx="14" fill="#f4f6f8" stroke="#c3ccd5" stroke-width="2"/>
<text id="text-14" x="447" y="334" class="heading" font-size="22px" style="font-size:22px">Removes</text>
<text id="text-15" x="447" y="368" class="body">Pod, Services, ConfigMap,</text>
<text id="text-16" x="447" y="393" class="body">Secret.</text>
<rect x="425" y="450" width="350" height="110" rx="14" fill="#fff6e8" stroke="#d5ba83" stroke-width="2"/>
<text id="text-17" x="447" y="484" class="heading" font-size="22px" style="font-size:22px">Result</text>
<text id="text-18" x="447" y="518" class="body">PVC kept by its keep annotation.</text>
<path d="M600.0 255.0 L600.0 300.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M600.0 410.0 L600.0 450.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="810" y="125" width="350" height="130" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-19" x="832" y="159" class="heading" font-size="22px" style="font-size:22px">Delete the PVC</text>
<text id="text-20" x="832" y="193" class="code">kubectl delete pvc</text>
<text id="text-21" x="832" y="218" class="code">postgresql-pvc -n db</text>
<rect x="810" y="300" width="350" height="110" rx="14" fill="#f4f6f8" stroke="#c3ccd5" stroke-width="2"/>
<text id="text-22" x="832" y="334" class="heading" font-size="22px" style="font-size:22px">Removes</text>
<text id="text-23" x="832" y="368" class="body">The claim; volume handling</text>
<text id="text-24" x="832" y="393" class="body">depends on reclaim policy.</text>
<rect x="810" y="450" width="350" height="110" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-25" x="832" y="484" class="heading" font-size="22px" style="font-size:22px">Result</text>
<text id="text-26" x="832" y="518" class="body">Delete may remove storage.</text>
<path d="M985.0 255.0 L985.0 300.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M985.0 410.0 L985.0 450.0" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="600" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-27" x="60" y="630" class="body">Take a pg_dump backup before any operation in the right-hand column.</text>
</svg>
