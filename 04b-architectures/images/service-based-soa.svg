<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="626" viewBox="0 0 1200 626" role="img" aria-labelledby="title description">
<title id="title">Services expose capabilities through contracts</title>
<desc id="description">Web and partner applications call a Workspace service for todos, teams, and reports, and a Messaging service for message delivery. Callers depend on supported capability contracts rather than private implementation details.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1559a6"/></marker></defs>
<rect width="1200" height="626" fill="#fff"/>
<style>text{font-family:'DejaVu Sans',sans-serif;fill:#152b43}.body{font-size:18px}.muted{fill:#425b70;font-size:18px}.heading{font-size:23px;font-weight:700}.code{font-family:'DejaVu Sans Mono',monospace;font-size:17px}</style>
<text id="text-1" x="40" y="49" class="body" font-size="28px" style="font-size:28px" font-weight="700">Services expose capabilities through contracts</text>
<text id="text-2" x="40" y="83" class="muted">This coarser service-based example keeps several related responsibilities together.</text>
<rect x="40" y="150" width="1120" height="110" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-4" x="62" y="184" class="heading" font-size="22px" style="font-size:22px">Web and partner applications</text>
<text id="text-5" x="62" y="218" class="body">Use supported operations and handle contract changes and dependency failures.</text>
<path d="M600 260 V310 H310.0 V360" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="360" width="540.0" height="124" rx="14" fill="#eff5fc" stroke="#adc5df" stroke-width="2"/>
<text id="text-8" x="62.0" y="394" class="heading" font-size="22px" style="font-size:22px">Workspace API</text>
<text id="text-9" x="62.0" y="428" class="body">Owns todos, teams, and reports. Keeps internal</text>
<text id="text-10" x="62.0" y="453" class="body">modules behind its interface.</text>
<path d="M600 260 V310 H890.0 V360" fill="none" stroke="#1559a6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="620.0" y="360" width="540.0" height="124" rx="14" fill="#f3f0fc" stroke="#bcb0d6" stroke-width="2"/>
<text id="text-13" x="642.0" y="394" class="heading" font-size="22px" style="font-size:22px">Messaging API</text>
<text id="text-14" x="642.0" y="428" class="body">Owns delivery behavior and status. Hides</text>
<text id="text-15" x="642.0" y="453" class="body">transport-specific implementation.</text>
<rect x="40" y="536" width="1120" height="60" rx="14" fill="#edf8f2" stroke="#9bceba" stroke-width="2"/>
<text id="text-17" x="60" y="566" class="body">SOA is a broad label. A central enterprise service bus is one integration choice, not a mandatory component.</text>
</svg>
